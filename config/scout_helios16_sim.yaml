# Faster-LIO on the Scout Gazebo model.
# Ground-truth from URDF: imu_link at z=0.12, rslidar at z=0.307, same axes.
# t_lidar_wrt_imu = (0, 0, 0.187)
common:
  lid_topic: "/rslidar_points"
  imu_topic: "/ugv1/imu/data_raw"
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0

preprocess:
  lidar_type: 5
  scan_line: 16
  scan_rate: 10
  blind: 0.4

mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 360
  det_range: 80.0
  extrinsic_est_en: false
  extrinsic_T: [0.0, 0.0, 0.187]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]

publish:
  path_publish_en: true
  scan_publish_en: true
  dense_publish_en: true
  scan_bodyframe_pub_en: true
  # Display ground removal is Patchwork++, not this clip.
  viz_z_min: -1000.0

pcd_save:
  pcd_save_en: false

feature_extract_enable: false
point_filter_num: 2
max_iteration: 3
filter_size_surf: 0.15
filter_size_map: 0.25
cube_side_length: 1000
ivox_grid_resolution: 0.2
ivox_nearby_type: 18
esti_plane_threshold: 0.1
